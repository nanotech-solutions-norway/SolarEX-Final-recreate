<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SolarEX documentation workflow</title><desc id="desc">Workflow from technical review through documentation, application guidance, pilot plan and commercial evaluation.</desc><rect width="1200" height="720" rx="28" fill="#10141a"/><text x="80" y="88" fill="#d6e5ef" font-family="Georgia" font-size="42">Documentation workflow</text><text x="80" y="128" fill="#a8bdcb" font-family="Georgia" font-size="21">Route files by technical purpose, not by generic download behavior.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#66a8ee"/></marker></defs><g transform="translate(90 250)" font-family="Georgia"><g><rect width="180" height="142" rx="18" fill="rgba(102,168,238,.14)" stroke="rgba(102,168,238,.42)"/><text x="24" y="52" fill="#fff" font-size="24">Technical</text><text x="24" y="84" fill="#fff" font-size="24">review</text></g><g transform="translate(230 0)"><rect width="180" height="142" rx="18" fill="rgba(214,229,239,.07)" stroke="rgba(214,229,239,.18)"/><text x="24" y="52" fill="#fff" font-size="24">Document</text><text x="24" y="84" fill="#fff" font-size="24">routing</text></g><g transform="translate(460 0)"><rect width="180" height="142" rx="18" fill="rgba(92,201,123,.11)" stroke="rgba(92,201,123,.36)"/><text x="24" y="52" fill="#fff" font-size="24">Application</text><text x="24" y="84" fill="#fff" font-size="24">guidance</text></g><g transform="translate(690 0)"><rect width="180" height="142" rx="18" fill="rgba(255,210,26,.10)" stroke="rgba(255,210,26,.34)"/><text x="24" y="52" fill="#fff" font-size="24">Pilot</text><text x="24" y="84" fill="#fff" font-size="24">plan</text></g><g transform="translate(920 0)"><rect width="180" height="142" rx="18" fill="rgba(102,168,238,.10)" stroke="rgba(102,168,238,.34)"/><text x="24" y="52" fill="#fff" font-size="24">Commercial</text><text x="24" y="84" fill="#fff" font-size="24">evaluation</text></g></g><g stroke="#66a8ee" stroke-width="5" marker-end="url(#arrow)"><path d="M280 321h36"/><path d="M510 321h36"/><path d="M740 321h36"/><path d="M970 321h36"/></g><g transform="translate(150 485)" font-family="Georgia" font-size="18" fill="#a8bdcb"><text x="0" y="0">File families: TDS / overview • application guide • pilot planning • safety/compliance • evidence summary</text><text x="0" y="42">Public site routes users to forms. Documentation is supplied according to site context and request purpose.</text></g></svg>