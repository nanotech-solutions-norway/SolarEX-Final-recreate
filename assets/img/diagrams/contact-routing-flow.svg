<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SolarEX contact routing flow</title><desc id="desc">Contact workflow routing technical review, commercial discussion and documentation pilot support through managed forms and SQL registration.</desc><rect width="1200" height="720" rx="28" fill="#10141a"/><text x="80" y="88" fill="#d6e5ef" font-family="Georgia" font-size="42">Contact conversion workflow</text><text x="80" y="128" fill="#a8bdcb" font-family="Georgia" font-size="21">Route public inquiries through managed forms and internal review logic.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#66a8ee"/></marker></defs><g font-family="Georgia"><g transform="translate(95 210)"><rect width="300" height="132" rx="18" fill="rgba(102,168,238,.13)" stroke="rgba(102,168,238,.42)"/><text x="24" y="46" fill="#fff" font-size="25">Technical review</text><text x="24" y="84" fill="#a8bdcb" font-size="16">Pathway, UV, contamination, pilot.</text></g><g transform="translate(450 210)"><rect width="300" height="132" rx="18" fill="rgba(92,201,123,.11)" stroke="rgba(92,201,123,.38)"/><text x="24" y="46" fill="#fff" font-size="25">Commercial discussion</text><text x="24" y="84" fill="#a8bdcb" font-size="16">Procurement, partner, scale-up.</text></g><g transform="translate(805 210)"><rect width="300" height="132" rx="18" fill="rgba(255,210,26,.10)" stroke="rgba(255,210,26,.34)"/><text x="24" y="46" fill="#fff" font-size="25">Documentation / pilot</text><text x="24" y="84" fill="#a8bdcb" font-size="16">Files, study context, validation.</text></g><path d="M245 342v70M600 342v70M955 342v70" stroke="#66a8ee" stroke-width="4" marker-end="url(#arrow)"/><rect x="250" y="430" width="700" height="96" rx="18" fill="rgba(214,229,239,.07)" stroke="rgba(214,229,239,.18)"/><text x="448" y="488" fill="#fff" font-size="29">SQL registration and internal routing</text><path d="M600 526v70" stroke="#66a8ee" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="610" width="380" height="58" rx="16" fill="rgba(92,201,123,.13)" stroke="rgba(92,201,123,.36)"/><text x="482" y="646" fill="#fff" font-size="24">Review and follow-up</text></g></svg>