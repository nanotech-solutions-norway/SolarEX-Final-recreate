<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SolarEX pathway selection flow</title><desc id="desc">Decision flow comparing passive Quartz SiO₂ and active Titan TiO₂ pathways for photovoltaic glass.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10141a"/><stop offset="1" stop-color="#202733"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#66a8ee"/><stop offset="1" stop-color="#204c8e"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#5cc97b"/><stop offset="1" stop-color="#1d8050"/></linearGradient></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><g fill="none" stroke="rgba(214,229,239,.16)"><path d="M80 130h1040M80 590h1040M180 70v580M1020 70v580"/><path d="M120 440c220-70 420-70 640 0s300 50 340 0"/></g><text x="80" y="90" fill="#d6e5ef" font-family="Georgia" font-size="42">SolarEX route selection</text><text x="80" y="130" fill="#a8bdcb" font-family="Georgia" font-size="21">Select by UV availability, contamination profile, cleaning burden and pilot objective.</text><g transform="translate(80 190)"><rect width="270" height="132" rx="18" fill="rgba(214,229,239,.06)" stroke="rgba(214,229,239,.18)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="28">Site profile</text><text x="24" y="78" fill="#a8bdcb" font-family="Georgia" font-size="17">UV / climate</text><text x="24" y="105" fill="#a8bdcb" font-family="Georgia" font-size="17">Soiling / O&amp;M model</text></g><path d="M370 255h92" stroke="#66a8ee" stroke-width="5" marker-end="url(#m)"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#66a8ee"/></marker></defs><g transform="translate(480 145)"><rect width="285" height="170" rx="18" fill="rgba(102,168,238,.12)" stroke="rgba(102,168,238,.45)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="28">Quartz SiO₂</text><text x="24" y="80" fill="#d6e5ef" font-family="Georgia" font-size="18">Passive architecture</text><text x="24" y="110" fill="#a8bdcb" font-family="Georgia" font-size="16">UV-independent</text><text x="24" y="138" fill="#a8bdcb" font-family="Georgia" font-size="16">Dust / mineral soiling</text></g><g transform="translate(480 365)"><rect width="285" height="170" rx="18" fill="rgba(92,201,123,.11)" stroke="rgba(92,201,123,.45)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="28">Titan TiO₂</text><text x="24" y="80" fill="#d6e5ef" font-family="Georgia" font-size="18">Active photocatalysis</text><text x="24" y="110" fill="#a8bdcb" font-family="Georgia" font-size="16">UV-dependent</text><text x="24" y="138" fill="#a8bdcb" font-family="Georgia" font-size="16">Organic / biological fouling</text></g><g transform="translate(845 255)"><rect width="275" height="156" rx="18" fill="rgba(214,229,239,.06)" stroke="rgba(255,210,26,.35)"/><text x="24" y="44" fill="#fff" font-family="Georgia" font-size="28">Pilot evidence</text><text x="24" y="82" fill="#a8bdcb" font-family="Georgia" font-size="16">Matched control</text><text x="24" y="110" fill="#a8bdcb" font-family="Georgia" font-size="16">Cleaning log</text><text x="24" y="138" fill="#a8bdcb" font-family="Georgia" font-size="16">Commercial review</text></g><path d="M765 230c36 0 46 104 78 104" stroke="url(#blue)" stroke-width="5" fill="none"/><path d="M765 450c36 0 46-116 78-116" stroke="url(#green)" stroke-width="5" fill="none"/><circle cx="1010" cy="110" r="32" fill="#ffd21a" opacity=".9"/><g opacity=".85"><rect x="105" y="500" width="210" height="70" rx="12" fill="url(#blue)"/><rect x="105" y="588" width="142" height="16" rx="8" fill="#66a8ee"/><rect x="105" y="612" width="188" height="16" rx="8" fill="#5cc97b"/></g></svg>