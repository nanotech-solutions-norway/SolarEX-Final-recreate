<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Technology selection matrix</title><desc id="desc">Matrix comparing Quartz SiO₂ and Titan TiO₂ by mechanism, trigger, contamination fit, cleaning logic and validation needs.</desc><rect width="1200" height="720" rx="28" fill="#10141a"/><text x="78" y="86" fill="#d6e5ef" font-family="Georgia" font-size="42">SolarEX technology matrix</text><text x="78" y="126" fill="#a8bdcb" font-family="Georgia" font-size="21">Mechanism-led comparison for route selection and pilot planning.</text><g transform="translate(78 170)"><rect width="1044" height="430" rx="18" fill="rgba(214,229,239,.06)" stroke="rgba(214,229,239,.18)"/><g font-family="Georgia" font-size="18"><rect x="0" y="0" width="1044" height="70" rx="18" fill="rgba(102,168,238,.14)"/><text x="30" y="44" fill="#fff">Decision area</text><text x="405" y="44" fill="#fff">Quartz SiO₂</text><text x="760" y="44" fill="#fff">Titan TiO₂</text></g><g font-family="Georgia" font-size="17" fill="#d6e5ef"><text x="30" y="116">Surface architecture</text><text x="405" y="116">Passive surface-energy control</text><text x="760" y="116">Active photocatalytic surface</text><text x="30" y="182">Trigger dependency</text><text x="405" y="182">UV-independent</text><text x="760" y="182">UV-dependent</text><text x="30" y="248">Contamination profile</text><text x="405" y="248">Dust / salt / mineral soiling</text><text x="760" y="248">Organic / biological / atmospheric</text><text x="30" y="314">Cleaning logic</text><text x="405" y="314">Reduced adhesion + easier cleaning</text><text x="760" y="314">Organic breakdown + rinse sheeting</text><text x="30" y="380">Validation need</text><text x="405" y="380">Cleaning log + treated control</text><text x="760" y="380">UV baseline + interval monitoring</text></g><g stroke="rgba(214,229,239,.14)"><path d="M360 0v430M715 0v430"/><path d="M0 70h1044M0 136h1044M0 202h1044M0 268h1044M0 334h1044"/></g></g><g transform="translate(166 635)"><circle r="8" fill="#66a8ee"/><text x="18" y="7" fill="#a8bdcb" font-family="Georgia" font-size="17">Quartz = passive route</text><circle cx="290" r="8" fill="#5cc97b"/><text x="308" y="7" fill="#a8bdcb" font-family="Georgia" font-size="17">Titan = active route</text><circle cx="570" r="8" fill="#ffd21a"/><text x="588" y="7" fill="#a8bdcb" font-family="Georgia" font-size="17">Pilot validates site-specific fit</text></g></svg>