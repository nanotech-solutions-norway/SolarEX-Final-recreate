<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Quartz SiO₂ passive layer diagram</title><desc id="desc">Passive SiO₂ layer on photovoltaic glass with water beading and reduced adhesion behavior.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10141a"/><stop offset="1" stop-color="#263340"/></linearGradient><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#204c8e"/><stop offset=".55" stop-color="#66a8ee"/><stop offset="1" stop-color="#d6e5ef"/></linearGradient></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="80" y="92" fill="#d6e5ef" font-family="Georgia" font-size="42">Quartz SiO₂ passive architecture</text><text x="80" y="132" fill="#a8bdcb" font-family="Georgia" font-size="21">Transparent nano-scale surface layer for UV-independent adhesion reduction.</text><g transform="translate(90 425)"><rect width="1020" height="72" rx="12" fill="#0f1620" stroke="rgba(214,229,239,.24)"/><rect y="-34" width="1020" height="34" rx="10" fill="url(#glass)" opacity=".88"/><rect y="-55" width="1020" height="18" rx="9" fill="#66a8ee" opacity=".55"/><text x="28" y="45" fill="#a8bdcb" font-family="Georgia" font-size="20">PV glass substrate</text><text x="28" y="-62" fill="#d6e5ef" font-family="Georgia" font-size="19">SiO₂ easy-clean layer</text></g><g fill="#66a8ee" opacity=".92"><ellipse cx="250" cy="312" rx="58" ry="38"/><ellipse cx="420" cy="280" rx="45" ry="31"/><ellipse cx="600" cy="325" rx="70" ry="43"/><ellipse cx="810" cy="290" rx="52" ry="35"/></g><g fill="none" stroke="#d6e5ef" stroke-width="3" opacity=".48"><path d="M210 300c30-35 72-34 105-2"/><path d="M560 310c35-42 83-40 122-3"/><path d="M780 278c32-30 70-30 96 0"/></g><g transform="translate(90 175)"><rect width="300" height="126" rx="18" fill="rgba(102,168,238,.12)" stroke="rgba(102,168,238,.42)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="27">Reduced adhesion</text><text x="24" y="80" fill="#a8bdcb" font-family="Georgia" font-size="17">Dust, pollen, salt and grime</text><text x="24" y="106" fill="#a8bdcb" font-family="Georgia" font-size="17">release more easily under cleaning.</text></g><g transform="translate(450 175)"><rect width="300" height="126" rx="18" fill="rgba(214,229,239,.06)" stroke="rgba(214,229,239,.18)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="27">UV-independent</text><text x="24" y="80" fill="#a8bdcb" font-family="Georgia" font-size="17">Passive behavior does not</text><text x="24" y="106" fill="#a8bdcb" font-family="Georgia" font-size="17">require photocatalytic activation.</text></g><g transform="translate(810 175)"><rect width="300" height="126" rx="18" fill="rgba(92,201,123,.10)" stroke="rgba(92,201,123,.35)"/><text x="24" y="42" fill="#fff" font-family="Georgia" font-size="27">Easy-clean logic</text><text x="24" y="80" fill="#a8bdcb" font-family="Georgia" font-size="17">Supports cleaning efficiency;</text><text x="24" y="106" fill="#a8bdcb" font-family="Georgia" font-size="17">does not eliminate O&amp;M.</text></g><path d="M170 570h820" stroke="rgba(102,168,238,.45)" stroke-width="8" stroke-linecap="round"/><path d="M170 570h560" stroke="#66a8ee" stroke-width="8" stroke-linecap="round"/><text x="170" y="625" fill="#d6e5ef" font-family="Georgia" font-size="20">Conceptual relative adhesion-reduction support</text></svg>