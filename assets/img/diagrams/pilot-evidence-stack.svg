<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SolarEX pilot evidence stack</title><desc id="desc">Evidence stack for SolarEX pilot validation showing baseline, treatment, monitoring, cleaning log and commercial review.</desc><rect width="1200" height="720" rx="28" fill="#10141a"/><text x="80" y="88" fill="#d6e5ef" font-family="Georgia" font-size="42">Pilot evidence architecture</text><text x="80" y="128" fill="#a8bdcb" font-family="Georgia" font-size="21">Convert reference evidence into site-specific validation before scale-up.</text><g transform="translate(150 180)"><rect width="900" height="82" rx="18" fill="rgba(102,168,238,.14)" stroke="rgba(102,168,238,.42)"/><text x="34" y="51" fill="#fff" font-family="Georgia" font-size="28">1. Baseline production and site profile</text></g><g transform="translate(190 282)"><rect width="820" height="82" rx="18" fill="rgba(214,229,239,.07)" stroke="rgba(214,229,239,.18)"/><text x="34" y="51" fill="#d6e5ef" font-family="Georgia" font-size="28">2. Matched treated / control areas</text></g><g transform="translate(230 384)"><rect width="740" height="82" rx="18" fill="rgba(92,201,123,.12)" stroke="rgba(92,201,123,.38)"/><text x="34" y="51" fill="#fff" font-family="Georgia" font-size="28">3. Monitoring interval and cleaning log</text></g><g transform="translate(270 486)"><rect width="660" height="82" rx="18" fill="rgba(255,210,26,.10)" stroke="rgba(255,210,26,.36)"/><text x="34" y="51" fill="#fff" font-family="Georgia" font-size="28">4. Commercial review and decision</text></g><g fill="none" stroke="#66a8ee" stroke-width="4" opacity=".55"><path d="M600 262v20M600 364v20M600 466v20"/></g><g font-family="Georgia" font-size="17" fill="#a8bdcb"><text x="80" y="640">Evidence remains contextual: no universal yield guarantee, no maintenance-free claim, no unsupported ROI promise.</text></g></svg>