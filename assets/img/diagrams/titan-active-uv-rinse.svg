<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Titan TiO₂ UV activation and rinse diagram</title><desc id="desc">Active TiO₂ photocatalytic mechanism with UV activation, contaminant breakdown and hydrophilic rinse behavior.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10141a"/><stop offset="1" stop-color="#202733"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#5cc97b"/><stop offset="1" stop-color="#66a8ee"/></linearGradient></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="80" y="92" fill="#d6e5ef" font-family="Georgia" font-size="42">Titan TiO₂ active pathway</text><text x="80" y="132" fill="#a8bdcb" font-family="Georgia" font-size="21">UV-supported photocatalysis, organic contaminant breakdown and hydrophilic rinse behavior.</text><circle cx="1015" cy="115" r="46" fill="#ffd21a" opacity=".9"/><g stroke="#ffd21a" stroke-width="4" opacity=".65"><path d="M920 190l-145 150"/><path d="M970 190l-105 176"/><path d="M1030 188l-35 190"/></g><g transform="translate(115 410)"><rect width="970" height="70" rx="14" fill="#0f1620" stroke="rgba(214,229,239,.23)"/><rect y="-34" width="970" height="30" rx="12" fill="#66a8ee" opacity=".65"/><rect y="-61" width="970" height="18" rx="9" fill="url(#green)" opacity=".72"/><text x="28" y="43" fill="#a8bdcb" font-family="Georgia" font-size="20">PV glass substrate</text><text x="28" y="-68" fill="#d6e5ef" font-family="Georgia" font-size="19">TiO₂ active surface</text></g><g opacity=".9"><path d="M165 330c85-70 170 72 260 0s172 73 265 0 182 78 300 0" fill="none" stroke="#5cc97b" stroke-width="16" stroke-linecap="round"/><path d="M165 330c85-70 170 72 260 0s172 73 265 0 182 78 300 0" fill="none" stroke="#d6e5ef" stroke-width="3" opacity=".45"/></g><g fill="rgba(214,229,239,.20)"><circle cx="285" cy="280" r="22"/><circle cx="360" cy="300" r="16"/><circle cx="540" cy="270" r="20"/><circle cx="685" cy="300" r="18"/><circle cx="820" cy="278" r="16"/></g><g transform="translate(90 185)"><rect width="275" height="116" rx="18" fill="rgba(255,210,26,.09)" stroke="rgba(255,210,26,.36)"/><text x="22" y="40" fill="#fff" font-family="Georgia" font-size="26">1. UV activation</text><text x="22" y="78" fill="#a8bdcb" font-family="Georgia" font-size="16">TiO₂ absorbs UV photons.</text></g><g transform="translate(465 185)"><rect width="275" height="116" rx="18" fill="rgba(92,201,123,.09)" stroke="rgba(92,201,123,.36)"/><text x="22" y="40" fill="#fff" font-family="Georgia" font-size="26">2. ROS formation</text><text x="22" y="78" fill="#a8bdcb" font-family="Georgia" font-size="16">Reactive surface chemistry forms.</text></g><g transform="translate(840 185)"><rect width="275" height="116" rx="18" fill="rgba(102,168,238,.10)" stroke="rgba(102,168,238,.38)"/><text x="22" y="40" fill="#fff" font-family="Georgia" font-size="26">3. Rinse behavior</text><text x="22" y="78" fill="#a8bdcb" font-family="Georgia" font-size="16">Water sheets across the surface.</text></g><path d="M170 570h820" stroke="rgba(214,229,239,.14)" stroke-width="8" stroke-linecap="round"/><path d="M170 570h720" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/><text x="170" y="625" fill="#d6e5ef" font-family="Georgia" font-size="20">Conceptual UV suitability / activation dependency</text></svg>