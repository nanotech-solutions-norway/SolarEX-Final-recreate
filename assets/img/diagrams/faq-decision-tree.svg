<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SolarEX FAQ decision tree</title><desc id="desc">FAQ decision tree for selecting Quartz SiO₂ or Titan TiO₂ based on UV, contamination and pilot needs.</desc><rect width="1200" height="720" rx="28" fill="#10141a"/><text x="80" y="88" fill="#d6e5ef" font-family="Georgia" font-size="42">FAQ decision tree</text><text x="80" y="128" fill="#a8bdcb" font-family="Georgia" font-size="21">Start with mechanism. Then validate by site and pilot context.</text><g font-family="Georgia"><rect x="440" y="170" width="320" height="96" rx="18" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.2)"/><text x="490" y="228" fill="#fff" font-size="26">What dominates the site?</text><path d="M600 266v50M600 316H330M600 316h270" stroke="#66a8ee" stroke-width="4" fill="none"/><rect x="145" y="340" width="370" height="120" rx="18" fill="rgba(102,168,238,.13)" stroke="rgba(102,168,238,.42)"/><text x="178" y="390" fill="#fff" font-size="25">Mineral / dust / salt?</text><text x="178" y="426" fill="#a8bdcb" font-size="17">Review Quartz SiO₂</text><rect x="685" y="340" width="370" height="120" rx="18" fill="rgba(92,201,123,.12)" stroke="rgba(92,201,123,.4)"/><text x="718" y="390" fill="#fff" font-size="25">Organic / biological?</text><text x="718" y="426" fill="#a8bdcb" font-size="17">Review Titan TiO₂ if UV is sufficient</text><path d="M330 460v58M870 460v58" stroke="#66a8ee" stroke-width="4"/><rect x="195" y="520" width="270" height="90" rx="16" fill="rgba(214,229,239,.06)" stroke="rgba(214,229,239,.16)"/><text x="228" y="558" fill="#fff" font-size="21">Confirm cleaning log</text><text x="228" y="588" fill="#a8bdcb" font-size="15">Adhesion and O&amp;M burden</text><rect x="735" y="520" width="270" height="90" rx="16" fill="rgba(214,229,239,.06)" stroke="rgba(214,229,239,.16)"/><text x="768" y="558" fill="#fff" font-size="21">Confirm UV baseline</text><text x="768" y="588" fill="#a8bdcb" font-size="15">Activation and rinse behavior</text></g><text x="80" y="665" fill="#a8bdcb" font-family="Georgia" font-size="18">If unclear, route to technical review and design a treated/control pilot before scale-up.</text></svg>