<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="560" viewBox="0 0 1092 560" role="img" aria-labelledby="t d"><title id="t">SolarEX application and monitoring cycle</title><desc id="d">Radial application workflow with site assessment, surface preparation, controlled application, cure activation and monitoring review.</desc><defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop stop-color="#1a2734"/><stop offset="1" stop-color="#111923"/></radialGradient><style>.h{font:700 22px Georgia,serif;fill:#f3f8ff}.b{font:18px Inter,Arial,sans-serif;fill:#f3f8ff}.line{stroke:#5fa9ee;stroke-width:2}.ring{fill:none;stroke:#91a7bb;stroke-width:1;opacity:.55}.blue{fill:#1f7ad8}.pale{fill:#6ab5f2}.grey{fill:#7b8083}</style></defs><rect width="1092" height="560" fill="url(#bg)"/><g transform="translate(546 280)"><circle r="230" class="ring"/><circle r="190" class="ring"/><circle r="152" class="ring"/><circle r="116" class="ring"/><circle r="95" fill="#1f7ad8"/><text class="h" text-anchor="middle" x="0" y="-6">Monitoring</text><text class="h" text-anchor="middle" x="0" y="24">&amp; Review</text><circle class="blue" cx="-130" cy="-115" r="27"/><circle class="pale" cx="-173" cy="115" r="27"/><circle class="pale" cx="124" cy="-170" r="27"/><circle class="grey" cx="150" cy="165" r="27"/><path class="line" d="M-245-175h-260"/><path class="line" d="M-240 70h-282"/><path class="line" d="M240-175h260"/><path d="M240 70h260" stroke="#7b8083" stroke-width="2"/></g><g><text class="h" x="26" y="144">Site Assessment</text><text class="b" x="26" y="175">Initial evaluation of</text><text class="b" x="26" y="197">location and conditions</text><text class="b" x="26" y="219">before work begins.</text><text class="h" x="26" y="382">Controlled</text><text class="h" x="26" y="408">Application</text><text class="b" x="26" y="440">Precise and careful</text><text class="b" x="26" y="463">application of the</text><text class="b" x="26" y="486">treatment or coating.</text><text class="h" x=