<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Titan TiO₂ mechanism summary</title><desc id="d">Horizontal mechanism summary for Titan TiO₂: nanoparticles on glass, UV absorption, reactive oxygen species, decomposition, superhydrophilic response and rinse-off.</desc><rect width="1200" height="330" fill="#17212c"/><style>.h{font:24px Georgia,serif;fill:#6fb3ff}.b{font:18px Inter,Arial,sans-serif;fill:#f4f9ff}.m{font:16px Inter,Arial,sans-serif;fill:#d2e2ee}.line{stroke:#8fa7bb;stroke-width:2}.dot{fill:#6fb3ff}</style><text class="h" x="30" y="42">Mechanism Summary</text><line class="line" x1="90" y1="162" x2="1110" y2="162"/><g><circle class="dot" cx="170" cy="162" r="7"/><text class="b" text-anchor="middle" x="170" y="82">TiO₂ nanoparticles on glass</text><text class="b" text-anchor="middle" x="170" y="110">substrate</text></g><g><circle class="dot" cx="350" cy="162" r="7"/><text class="m" text-anchor="middle" x="350" y="225">UV photon absorption → electron-</text><text class="m" text-anchor="middle" x="350" y="250">hole pairs</text></g><g><circle class="dot" cx="520" cy="162" r="7"/><text class="b" text-anchor="middle" x="520" y="82">Reactive oxygen species</text><text class="b" text-anchor="middle" x="520" y="110">generation</text></g><g><circle class="dot" cx="690" cy="162" r="7"/><text class="m" text-anchor="middle" x="690" y="225">Decomposition of organic and</text><text class="m" text-anchor="middle" x="690" y="250">biological loads</text></g><g><circle class="dot" cx="860" cy="162" r="7"/><text class="b" text-anchor="middle" x="860" y="82">Superhydrophilic surface response</text><text class="b" text-anchor="middle" x="860" y="110">under UV</text></g><g><circle class="dot" cx="1030" cy="162" r="7"/><text class="m" text-anchor="middle" x="1030" y="225">Enhanced rinse-off and reduced</text><text class="m" text-anchor="middle" x="1030" y="250">soiling re-adhesion</text></g></svg>