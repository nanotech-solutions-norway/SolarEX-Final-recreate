<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX pilot validation model</title><desc id="d">Pilot validation diagram showing treated and untreated PV control strings, baseline data, monitoring, cleaning log and ROI decision output.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#17283b"/></linearGradient><linearGradient id="q" x1="0" x2="1"><stop stop-color="#66a8ee"/><stop offset="1" stop-color="#9fcfff"/></linearGradient><linearGradient id="titan" x1="0" x2="1"><stop stop-color="#5cc97b"/><stop offset="1" stop-color="#b2e8c1"/></linearGradient><style>.h{font:700 42px Georgia,serif;fill:#f4f9ff}.s{font:20px Georgia,serif;fill:#d2e2ee}.t{font:700 20px Georgia,serif;fill:#f4f9ff}.b{font:16px Georgia,serif;fill:#d2e2ee}.m{font:13px Georgia,serif;fill:#c7d8e5}</style></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text class="h" x="72" y="78">Pilot validation model</text><text class="s" x="72" y="116">Treat SolarEX evidence as controlled site validation, not a universal claim.</text><g transform="translate(72 170)"><rect width="500" height="230" rx="22" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.22)"/><text class="t" x="28" y="42">Matched PV strings</text><g transform="translate(35 78)"><rect width="180" height="42" rx="8" fill="rgba(102,168,238,.16)" stroke="#66a8ee"/><text class="b" x="18" y="27">Treated string</text><rect x="235" width="180" height="42" rx="8" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.35)"/><text class="b" x="253" y="27">Control string</text><path d="M20 72h390" stroke="rgba(214,229,239,.22)"/><text class="m" x="20" y="105">same tilt / orientation / inverter group where feasible</text></g></g><g transform="translate(628 170)"><rect width="500" height="230" rx="22" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.22)"/><text class="t" x="28" y="42">Data stack</text><g transform="translate(28 78)"><rect width="190" height="42" rx="8" fill="rgba(102,168,238,.12)" stroke="#66a8ee"/><text class="b" x="16" y="27">15-min monitoring</text><rect x="220" width="190" height="42" rx="8" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text class="b" x="238" y="27">Cleaning log</text><rect y="66" width="190" height="42" rx="8" fill="rgba(255,210,26,.10)" stroke="#ffd21a"/><text class="b" x="16" y="93">Weather / UV</text><rect x="220" y="66" width="190" height="42" rx="8" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.35)"/><text class="b" x="238" y="93">Soiling photos</text></g></g><g transform="translate(118 462)"><rect width="964" height="126" rx="22" fill="rgba(214,229,239,.05)" stroke="rgba(214,229,239,.22)"/><text class="t" x="28" y="40">Decision output</text><path d="M42 72h830" stroke="rgba(214,229,239,.16)"/><circle cx="105" cy="72" r="14" fill="#66a8ee"/><text class="b" x="130" y="78">Pathway fit</text><circle cx="315" cy="72" r="14" fill="#5cc97b"/><text class="b" x="340" y="78">Measured delta</text><circle cx="545" cy="72" r="14" fill="#ffd21a"/><text class="b" x="570" y="78">ROI scenario</text><circle cx="770" cy="72" r="14" fill="#d6e5ef"/><text class="b" x="795" y="78">Scale / repeat / no-go</text></g><text class="m" x="98" y="654">Required context: product route, geography, monitoring period, assumptions and limitation label.</text></svg>