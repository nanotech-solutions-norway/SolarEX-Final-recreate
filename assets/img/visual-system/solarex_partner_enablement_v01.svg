x="26" y="132" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="160">Surface preparation</text><rect x="26" y="194" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="222">Application workflow</text><rect x="26" y="256" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="284">Technical review form</text></g><g transform="translate(816 170)"><rect width="300" height="340" rx="24" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text class="t" x="26" y="45">O&amp;M provider</text><text class="b" x="26" y="88">Cleaning and evidence logic.</text><rect x="26" y="132" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="160">Cleaning log model</text><rect x="26" y="194" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="222">Treated/control pilot</text><rect x="26" y="256" width="238" height="44" rx="12" fill="rgba(214,229,239,.08)" stroke="rgba(214,229,239,.25)"/><text class="b" x="44" y="284">ROI assumptions</text></g><g transform="translate(92 588)"><rect width="1016" height="58" rx="16" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.20)"/><text class="b" x="24" y="36">Enablement output: documentation pack, pilot package, application guidance and evidence library — with no universal performance claims.</text></g></svg>