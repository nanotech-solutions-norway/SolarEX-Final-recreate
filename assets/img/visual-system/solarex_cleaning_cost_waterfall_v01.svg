<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX cleaning cost waterfall visual</title><desc id="d">Commercial O and M waterfall visual showing water, labor, access, downtime, abrasion risk and yield recovery as cleaning cost drivers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#182838"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#66a8ee"/><stop offset="1" stop-color="#5cc97b"/></linearGradient><style>.h{font:700 42px Georgia,serif;fill:#f4f9ff}.s{font:20px Georgia,serif;fill:#d2e2ee}.t{font:700 18px Georgia,serif;fill:#f4f9ff}.b{font:15px Georgia,serif;fill:#d2e2ee}.m{font:13px Georgia,serif;fill:#c7d8e5}</style></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text class="h" x="72" y="78">Cleaning cost drivers</text><text class="s" x="72" y="116">Use O&amp;M inputs to evaluate coating-assisted mitigation, not cleaning elimination.</text><g transform="translate(105 180)"><line x1="0" y1="335" x2="990" y2="335" stroke="rgba(214,229,239,.25)"/><g transform="translate(20 90)"><rect y="145" width="110" height="100" rx="12" fill="rgba(102,168,238,.20)" stroke="#66a8ee"/><text class="t" x="10" y="280">Water</text><text class="m" x="8" y="302">volume / logistics</text></g><g transform="translate(165 55)"><rect y="110" width="110" height="135" rx="12" fill="rgba(102,168,238,.17)" stroke="#66a8ee"/><text class="t" x="10" y="280">Labor</text><text class="m" x="8" y="302">crew time</text></g><g transform="translate(310 25)"><rect y="80" width="110" height="165" rx="12" fill="rgba(255,210,26,.14)" stroke="#ffd21a"/><text class="t" x="10" y="280">Access</text><text class="m" x="8" y="302">truck-roll / roof</text></g><g transform="translate(455 80)"><rect y="135" width="110" height="110" rx="12" fill="rgba(255,210,26,.11)" stroke="#ffd21a"/><text class="t" x="10" y="280">Downtime</text><text class="m" x="8" y="302">availability</text></g><g transform="translate(600 120)"><rect y="175" width="110" height="70" rx="12" fill="rgba(214,229,239,.10)" stroke="rgba(214,229,239,.42)"/><text class="t" x="10" y="280">Abrasion</text><text class="m" x="8" y="302">surface risk</text></g><g transform="translate(770 55)"><rect y="110" width="150" height="135" rx="12" fill="rgba(92,201,123,.20)" stroke="#5cc97b"/><text class="t" x="10" y="280">Yield recovery</text><text class="m" x="8" y="302">scenario value</text></g><path d="M70 205 C180 170 250 150 365 115 S535 205 650 210 S805 160 880 120" fill="none" stroke="url(#bar)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/></g><g transform="translate(92 585)"><rect width="1016" height="58" rx="16" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.20)"/><text class="b" x="24" y="36">Visual rule: model local water, labor, access and energy value. Validate with treated/control monitoring before scale-up.</text></g></svg>