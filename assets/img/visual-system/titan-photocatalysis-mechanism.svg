<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX Titan TiO₂ photocatalysis mechanism</title><desc id="d">Modern four-step Titan TiO₂ diagram showing UV activation, reactive oxygen species formation, organic contaminant decomposition and hydrophilic rinse behavior.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#1c2c24"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5cc97b"/><stop offset="1" stop-color="#66a8ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g transform="translate(82 84)"><text fill="#fff" font-family="Georgia,serif" font-size="46" font-weight="700">Titan TiO₂ active photocatalytic route</text><text y="50" fill="#d6e5ef" font-family="Arial" font-size="22">UV activation → ROS formation → organic breakdown → hydrophilic rinse behavior</text></g><g transform="translate(100 245)"><g><rect width="230" height="260" rx="24" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.18)"/><circle cx="55" cy="58" r="26" fill="#ffd21a"/><path d="M55 10 V30 M55 86 V106 M10 58 H30 M80 58 H104 M24 27 L39 42 M71 74 L88 91 M88 27 L72 43 M23 91 L39 75" stroke="#ffd21a" stroke-width="4" stroke-linecap="round"/><text x="28" y="145" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">1. UV exposure</text><text x="28" y="184" fill="#d6e5ef" font-family="Arial" font-size="17">Sunlight activates the TiO₂ surface.</text></g><g transform="translate(262 0)"><rect width="230" height="260" rx="24" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.18)"/><g filter="url(#glow)" fill="none" stroke="#5cc97b" stroke-width="5"><circle cx="82" cy="58" r="28"/><circle cx="132" cy="82" r="20"/><path d="M103 68 L118 76"/></g><text x="28" y="145" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">2. ROS formation</text><text x="28" y="184" fill="#d6e5ef" font-family="Arial" font-size="17">Reactive species form at the surface.</text></g><g transform="translate(524 0)"><rect width="230" height="260" rx="24" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.18)"/><g><path d="M70 50 C110 24 150 42 162 78 C174 114 132 132 96 120 C58 108 40 74 70 50Z" fill="#d9a441" opacity=".76"/><path d="M58 130 L178 34" stroke="#5cc97b" stroke-width="7" stroke-linecap="round"/><path d="M58 34 L178 130" stroke="#5cc97b" stroke-width="7" stroke-linecap="round"/></g><text x="28" y="145" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">3. Decomposition</text><text x="28" y="184" fill="#d6e5ef" font-family="Arial" font-size="17">Organic contaminants are broken down.</text></g><g transform="translate(786 0)"><rect width="230" height="260" rx="24" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.18)"/><path d="M45 92 C102 42 160 42 205 90" fill="none" stroke="url(#green)" stroke-width="9" stroke-linecap="round"/><ellipse cx="92" cy="112" rx="32" ry="14" fill="#66a8ee" opacity=".78"/><ellipse cx="156" cy="112" rx="32" ry="14" fill="#5cc97b" opacity=".72"/><text x="28" y="145" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">4. Rinse behavior</text><text x="28" y="184" fill="#d6e5ef" font-family="Arial" font-size="17">Hydrophilic sheeting supports rinse-off.</text></g></g><g transform="translate(96 560)"><rect width="998" height="66" rx="16" fill="rgba(255,210,26,.10)" stroke="rgba(255,210,26,.38)"/><text x="28" y="41" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Mechanism dependency: Titan requires suitable UV exposure. Low-UV or mineral-dominant sites should route to Quartz or further review.</text></g></svg>