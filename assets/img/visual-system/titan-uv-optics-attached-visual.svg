<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="t d"><title id="t">Titan TiO₂ UV optical surface comparison</title><desc id="d">Technical comparison of contaminated glass and TiO₂ coated glass under UV radiation, showing reflection, scatter and absorption pathways.</desc><defs><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#1a2a38"/><stop offset="1" stop-color="#07111d"/></radialGradient><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#f4f1e7"/><stop offset="1" stop-color="#b8b8b0"/></linearGradient><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#18b840"/></marker><marker id="y" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#ffd21a"/></marker><style>.h{font:800 30px Inter,Arial,sans-serif;fill:#dcefff}.b{font:700 23px Inter,Arial,sans-serif;fill:#dcefff}.c{stroke:#2e64d8;stroke-width:5;stroke-dasharray:16 14}</style></defs><rect width="1600" height="690" fill="url(#bg)"/><g transform="translate(70 110)"><text class="h" x="260" y="0">UV radiation</text><circle cx="320" cy="75" r="60" fill="#ffd21a"/><path d="M280 170v80M325 170v80M370 170v80" stroke="#ffd21a" stroke-width="12" marker-end="url(#y)"/><polygon points="0,310 610,270 720,330 110,385" fill="url(#glass)"/><polygon points="110,385 720,330 720,370 110,430" fill="#85898b"/><circle cx="265" cy="422" r="15" fill="#aaa"/><circle cx="355" cy="405" r="20" fill="#c0c0c0"/><circle cx="470" cy="410" r="12" fill="#999"/><path class="c" d="M315 345l420-28"/><path d="M135 310l-96-58M275 300l-88-80M420 290l86-88M575 270l110-58" stroke="#18b840" stroke-width="10" marker-end="url(#g)"/><text class="h" x="0" y="235">Scattering</text><text class="h" x="520" y="222">Reflection</text><text class="h" x="715" y="312">Absorption</text><text class="b" x="150" y="505">Contaminated or mixed surface state</text></g><g transform="translate(890 110)"><text class="h" x="260" y="0">UV radiation</text><circle cx="320" cy="75" r="60" fill="#ffd21a"/><path d="M280 170v80M325 170v80M370 170v80" stroke="#ffd21a" stroke-width="12" marker-end="url(#y)"/><polygon points="0,310 610,270 720,330 110,385" fill="url(#glass)"/><polygon points="110,385 720,330 720,370 110,430" fill="#85898b"/><path class="c" d="M315 345l420-28"/><path d="M135 310l-96-58M275 300l-88-80M420 290l86-88M575 270l110-58" stroke="#18b840" stroke-width="10" marker-end="url(#g)"/><text class="h" x="0" y="235">Scattering</text><text class="h" x="520" y="222">Reflection</text><text class="h" x="715" y="312">Absorption</text><text class="b" x="205" y="505">TiO₂ coated surface</text></g><path d="M745 388h155" stroke="#2e64d8" stroke-width="22" marker-end="url(#g)"/><text class="h" x="742" y="355">TiO₂ coating</text></svg>