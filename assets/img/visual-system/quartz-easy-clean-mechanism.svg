<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX Quartz SiO₂ easy-clean mechanism</title><desc id="d">Modern SVG diagram showing a transparent SiO₂ nano-layer on PV glass, reduced contaminant adhesion, water beading and UV-independent easy-clean behavior.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#16283a"/></linearGradient><linearGradient id="layer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66a8ee"/><stop offset="1" stop-color="#5cc97b"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g transform="translate(95 92)"><text fill="#fff" font-family="Georgia,serif" font-size="46" font-weight="700">Quartz SiO₂ passive easy-clean route</text><text y="50" fill="#d6e5ef" font-family="Arial" font-size="22">UV-independent surface-energy control for dust, mineral soiling and cleaning-burden contexts</text></g><g transform="translate(110 330)"><path d="M0 130 L980 130 L900 255 L-80 255 Z" fill="#0d2b46" stroke="#66a8ee" stroke-opacity=".52" stroke-width="3"/><path d="M30 94 L1010 94 L980 130 L0 130 Z" fill="url(#layer)" opacity=".86"/><text x="40" y="84" fill="#fff" font-family="Arial" font-size="20" font-weight="700">transparent SiO₂ nano-layer</text></g><g fill="#d9a441" opacity=".75"><circle cx="250" cy="255" r="14"/><circle cx="312" cy="215" r="9"/><circle cx="372" cy="275" r="11"/><circle cx="438" cy="230" r="8"/><path d="M210 205 C310 160 430 182 535 145" fill="none" stroke="#d9a441" stroke-width="4" stroke-dasharray="9 14"/></g><g fill="#66a8ee" opacity=".82"><ellipse cx="775" cy="258" rx="44" ry="24"/><ellipse cx="910" cy="222" rx="34" ry="20"/><path d="M770 260 C845 310 930 302 1000 250" fill="none" stroke="#66a8ee" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(118 578)"><rect width="215" height="48" rx="24" fill="rgba(102,168,238,.14)" stroke="#66a8ee"/><text x="28" y="31" fill="#fff" font-family="Arial" font-size="17" font-weight="700">UV-independent</text></g><g transform="translate(360 578)"><rect width="285" height="48" rx="24" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text x="28" y="31" fill="#fff" font-family="Arial" font-size="17" font-weight="700">reduced surface adhesion</text></g><g transform="translate(674 578)"><rect width="250" height="48" rx="24" fill="rgba(102,168,238,.14)" stroke="#66a8ee"/><text x="28" y="31" fill="#fff" font-family="Arial" font-size="17" font-weight="700">water-beading support</text></g><g transform="translate(950 578)"><rect width="170" height="48" rx="24" fill="rgba(255,210,26,.12)" stroke="#ffd21a"/><text x="28" y="31" fill="#fff" font-family="Arial" font-size="17" font-weight="700">pilot review</text></g></svg>