<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX PV soiling taxonomy visual</title><desc id="d">Infographic classifying PV module soiling categories and routing them toward Quartz SiO₂ or Titan TiO₂ review.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#182838"/></linearGradient><linearGradient id="panel" x1="0" x2="1"><stop stop-color="#102033"/><stop offset="1" stop-color="#0b141e"/></linearGradient><style>.h{font:700 42px Georgia,serif;fill:#f4f9ff}.s{font:20px Georgia,serif;fill:#d2e2ee}.t{font:700 20px Georgia,serif;fill:#f4f9ff}.b{font:16px Georgia,serif;fill:#d2e2ee}.q{fill:#66a8ee}.ti{fill:#5cc97b}.n{fill:#ffd21a}</style></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text class="h" x="72" y="78">PV soiling taxonomy</text><text class="s" x="72" y="116">Classify contamination before selecting Quartz SiO₂, Titan TiO₂ or further review.</text><g transform="translate(90 170)"><rect width="1020" height="250" rx="22" fill="url(#panel)" stroke="rgba(214,229,239,.22)"/><g transform="translate(55 65)"><path d="M0 120 L650 120 L600 180 L-50 180Z" fill="#0a253b" stroke="#66a8ee" stroke-opacity=".55"/><path d="M40 92 L690 92 L650 120 L0 120Z" fill="#123b62"/><text class="b" x="45" y="82">PV glass surface</text><g fill="#d9a441" opacity=".85"><circle cx="130" cy="55" r="12"/><circle cx="190" cy="35" r="7"/><circle cx="245" cy="72" r="10"/><circle cx="315" cy="48" r="8"/></g><g fill="#c9d6df" opacity=".9"><circle cx="460" cy="48" r="10"/><circle cx="520" cy="62" r="7"/></g><path d="M95 22 C200 -5 310 4 420 -20" stroke="#d9a441" stroke-width="4" fill="none" stroke-dasharray="9 12"/><path d="M720 48 C790 8 862 18 930 50" stroke="#5cc97b" stroke-width="6" fill="none"/><text class="b" x="720" y="95">Optical transmission risk</text></g></g><g transform="translate(92 470)"><g><rect width="230" height="90" rx="18" fill="rgba(102,168,238,.12)" stroke="#66a8ee"/><text class="t" x="20" y="36">Mineral / dust</text><text class="b" x="20" y="66">Quartz-first review</text></g><g transform="translate(260 0)"><rect width="230" height="90" rx="18" fill="rgba(102,168,238,.10)" stroke="#66a8ee"/><text class="t" x="20" y="36">Salt / pollen</text><text class="b" x="20" y="66">Quartz or mixed review</text></g><g transform="translate(520 0)"><rect width="230" height="90" rx="18" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text class="t" x="20" y="36">Organic film</text><text class="b" x="20" y="66">Titan if UV supports</text></g><g transform="translate(780 0)"><rect width="230" height="90" rx="18" fill="rgba(92,201,123,.10)" stroke="#5cc97b"/><text class="t" x="20" y="36">Biological fouling</text><text class="b" x="20" y="66">Titan / further review</text></g></g><g transform="translate(90 598)"><rect width="1020" height="54" rx="16" fill="rgba(255,210,26,.08)" stroke="rgba(255,210,26,.35)"/><text class="b" x="22" y="34">Visual rule: this is a route-selection guide only. Pilot design and site conditions decide final recommendation.</text></g></svg>