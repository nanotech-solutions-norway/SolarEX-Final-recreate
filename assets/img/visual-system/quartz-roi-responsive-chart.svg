<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX Quartz ROI scenario chart</title><desc id="d">Responsive SVG-style ROI chart showing a scenario payback point around 147 days for Quartz under source assumptions. The chart is an indicative scenario, not a guaranteed payback claim.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#17283b"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66a8ee"/><stop offset="1" stop-color="#5cc97b"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g transform="translate(88 80)"><text fill="#fff" font-family="Georgia,serif" font-size="44" font-weight="700">Quartz Europe ROI scenario</text><text y="48" fill="#d6e5ef" font-family="Arial" font-size="21">Indicative payback model under stated source assumptions — not a universal guarantee</text></g><g transform="translate(130 185)"><line x1="0" y1="390" x2="940" y2="390" stroke="#d6e5ef" stroke-opacity=".28"/><line x1="0" y1="60" x2="0" y2="390" stroke="#d6e5ef" stroke-opacity=".28"/><g stroke="#d6e5ef" stroke-opacity=".12"><line x1="0" y1="310" x2="940" y2="310"/><line x1="0" y1="230" x2="940" y2="230"/><line x1="0" y1="150" x2="940" y2="150"/><line x1="0" y1="70" x2="940" y2="70"/></g><path d="M0 385 C90 355 145 322 205 288 C285 242 350 206 430 164 C520 116 615 93 735 82 C820 74 885 70 940 65" fill="none" stroke="url(#bar)" stroke-width="8" stroke-linecap="round"/><path d="M405 390 V160" stroke="#ffd21a" stroke-width="4" stroke-dasharray="9 10"/><circle cx="405" cy="174" r="11" fill="#ffd21a"/><text x="430" y="178" fill="#fff" font-family="Arial" font-size="20" font-weight="700">~147-day payback point</text><text x="0" y="432" fill="#d6e5ef" font-family="Arial" font-size="16">0</text><text x="370" y="432" fill="#d6e5ef" font-family="Arial" font-size="16">147 days</text><text x="902" y="432" fill="#d6e5ef" font-family="Arial" font-size="16">1 year</text><text x="-78" y="76" fill="#d6e5ef" font-family="Arial" font-size="16">higher value</text><text x="-84" y="392" fill="#d6e5ef" font-family="Arial" font-size="16">baseline</text></g><g transform="translate(88 628)"><rect width="1000" height="54" rx="14" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.18)"/><text x="24" y="34" fill="#d6e5ef" font-family="Arial" font-size="18">Chart summary: scenario inputs include local energy value, sunshine hours, coating cost and performance assumption. Confirm with treated/control monitoring.</text></g></svg>