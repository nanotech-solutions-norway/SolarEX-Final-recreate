<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX Quartz and Titan technology route matrix</title><desc id="d">Technology comparison matrix separating Quartz SiO₂ and Titan TiO₂ by mechanism, trigger dependency, contamination profile and evidence gate.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#182838"/></linearGradient><linearGradient id="q" x1="0" x2="1"><stop stop-color="#66a8ee"/><stop offset="1" stop-color="#204c8e"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5cc97b"/><stop offset="1" stop-color="#1d8050"/></linearGradient><style>.h{font:700 42px Georgia,serif;fill:#f4f9ff}.s{font:20px Georgia,serif;fill:#d2e2ee}.t{font:700 26px Georgia,serif;fill:#f4f9ff}.b{font:16px Georgia,serif;fill:#d2e2ee}.m{font:14px Georgia,serif;fill:#c7d8e5}</style></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text class="h" x="72" y="78">SolarEX technology route matrix</text><text class="s" x="72" y="116">Compare mechanism, trigger dependency and site-fit before commercial selection.</text><g transform="translate(82 165)"><rect width="476" height="420" rx="26" fill="rgba(102,168,238,.12)" stroke="#66a8ee"/><text class="t" x="32" y="52">Quartz SiO₂</text><text class="b" x="32" y="91">Passive surface architecture</text><g transform="translate(32 132)"><rect width="412" height="58" rx="14" fill="rgba(102,168,238,.16)"/><text class="b" x="20" y="36">UV-independent easy-clean behavior</text><rect y="82" width="412" height="58" rx="14" fill="rgba(102,168,238,.12)"/><text class="b" x="20" y="118">Dust, salt, pollen and mineral particles</text><rect y="164" width="412" height="58" rx="14" fill="rgba(102,168,238,.10)"/><text class="b" x="20" y="200">Reduced adhesion and cleaning recovery</text><rect y="246" width="412" height="58" rx="14" fill="rgba(102,168,238,.08)"/><text class="b" x="20" y="282">ROI scenario + local O&amp;M validation</text></g></g><g transform="translate(642 165)"><rect width="476" height="420" rx="26" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text class="t" x="32" y="52">Titan TiO₂</text><text class="b" x="32" y="91">Active photocatalytic pathway</text><g transform="translate(32 132)"><rect width="412" height="58" rx="14" fill="rgba(92,201,123,.16)"/><text class="b" x="20" y="36">UV-supported activation required</text><rect y="82" width="412" height="58" rx="14" fill="rgba(92,201,123,.12)"/><text class="b" x="20" y="118">Organic, biological and atmospheric fouling</text><rect y="164" width="412" height="58" rx="14" fill="rgba(92,201,123,.10)"/><text class="b" x="20" y="200">ROS generation + hydrophilic rinse response</text><rect y="246" width="412" height="58" rx="14" fill="rgba(92,201,123,.08)"/><text class="b" x="20" y="282">Monitored pilot + UV suitability review</text></g></g><path d="M558 374h84" stroke="#ffd21a" stroke-width="8"/><circle cx="600" cy="374" r="44" fill="rgba(255,210,26,.12)" stroke="#ffd21a"/><text class="m" text-anchor="middle" x="600" y="366">site-fit</text><text class="m" text-anchor="middle" x="600" y="388">gate</text><g transform="translate(92 622)"><rect width="1016" height="52" rx="16" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.20)"/><text class="b" x="24" y="33">Visual rule: Quartz and Titan are separate routes. Selection depends on UV context, contamination profile and pilot objective.</text></g></svg>