<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">SolarEX regional operating context cards</title><desc id="d">Regional visual cards for Europe, Middle East/GCC and Nordics operating contexts, with Quartz/Titan route review guidance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#182838"/></linearGradient><style>.h{font:700 42px Georgia,serif;fill:#f4f9ff}.s{font:20px Georgia,serif;fill:#d2e2ee}.t{font:700 28px Georgia,serif;fill:#f4f9ff}.b{font:17px Georgia,serif;fill:#d2e2ee}.m{font:14px Georgia,serif;fill:#c7d8e5}</style></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text class="h" x="72" y="78">Regional operating context</text><text class="s" x="72" y="116">Use regional conditions to frame route selection, pilot design and ROI assumptions.</text><g transform="translate(72 170)"><rect width="320" height="370" rx="24" fill="rgba(102,168,238,.13)" stroke="#66a8ee"/><text class="t" x="28" y="48">Europe</text><text class="b" x="28" y="90">Rain cycles, pollen, grime, coastal salt.</text><g transform="translate(28 140)"><circle cx="35" cy="35" r="25" fill="#66a8ee" opacity=".8"/><circle cx="105" cy="35" r="25" fill="#d6e5ef" opacity=".72"/><circle cx="175" cy="35" r="25" fill="#5cc97b" opacity=".65"/><text class="m" x="0" y="92">Quartz-first screening where mineral / mixed soiling and O&amp;M burden dominate.</text></g><rect x="28" y="285" width="244" height="46" rx="23" fill="rgba(102,168,238,.20)" stroke="#66a8ee"/><text class="b" x="50" y="314">Quartz SiO₂ route review</text></g><g transform="translate(440 170)"><rect width="320" height="370" rx="24" fill="rgba(255,210,26,.10)" stroke="#ffd21a"/><text class="t" x="28" y="48">Middle East / GCC</text><text class="b" x="28" y="90">Dust, sand, high irradiance, water logistics.</text><g transform="translate(28 140)"><circle cx="35" cy="35" r="25" fill="#d9a441" opacity=".85"/><circle cx="105" cy="35" r="25" fill="#ffd21a" opacity=".75"/><circle cx="175" cy="35" r="25" fill="#66a8ee" opacity=".68"/><text class="m" x="0" y="92">Prioritize easy-clean, water/labor economics and treated/control pilot validation.</text></g><rect x="28" y="285" width="244" height="46" rx="23" fill="rgba(255,210,26,.13)" stroke="#ffd21a"/><text class="b" x="50" y="314">Dust / water scenario</text></g><g transform="translate(808 170)"><rect width="320" height="370" rx="24" fill="rgba(92,201,123,.12)" stroke="#5cc97b"/><text class="t" x="28" y="48">Nordics</text><text class="b" x="28" y="90">Low-angle sun, rainfall, pollen, seasonal grime.</text><g transform="translate(28 140)"><circle cx="35" cy="35" r="25" fill="#d6e5ef" opacity=".78"/><circle cx="105" cy="35" r="25" fill="#66a8ee" opacity=".72"/><circle cx="175" cy="35" r="25" fill="#5cc97b" opacity=".72"/><text class="m" x="0" y="92">Review UV availability carefully. Quartz may be the first route in low-UV contexts.</text></g><rect x="28" y="285" width="244" height="46" rx="23" fill="rgba(92,201,123,.14)" stroke="#5cc97b"/><text class="b" x="50" y="314">High-latitude screening</text></g><g transform="translate(92 598)"><rect width="1016" height="58" rx="16" fill="rgba(214,229,239,.055)" stroke="rgba(214,229,239,.20)"/><text class="b" x="24" y="36">Regional visuals are operating-context aids. Final route selection still requires site profile, contamination review and pilot plan.</text></g></svg>